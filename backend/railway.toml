[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
numReplicas = 1

# Railway API service settings (Dashboard → Service → Settings):
#   Root Directory: backend
#   Builder: Dockerfile (backend/Dockerfile)
# Variables: DATABASE_URL=${{Postgres.DATABASE_URL}}, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
#   FLASK_SECRET_KEY, CORS_ORIGINS=https://${{Web.RAILWAY_PUBLIC_DOMAIN}}
# Memory: 1GB+ recommended for ML classification (512MB may OOM when model loads).
