# Web service: use this when Railway Root Directory is the repo root (not react-app).
# If Root Directory is react-app, use react-app/railway.toml instead.

[build]
buildCommand = "cd react-app && npm install && npm run build"

[deploy]
startCommand = "cd react-app && npm run start"
restartPolicyType = "ON_FAILURE"
numReplicas = 1
healthcheckPath = ""
healthcheckTimeout = 300

# Required on this *web* service (baked in at build):
#   VITE_GOOGLE_CLIENT_ID = your Web client ID (...apps.googleusercontent.com)
#   VITE_API_URL = https://your-api-service.up.railway.app
# Optional fallback: GOOGLE_CLIENT_ID (same value) is also read at build time.
