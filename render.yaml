databases:
  - name: fabai-db
    plan: free
    databaseName: fabai
    user: fabai

services:
  - type: web
    name: fabai-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fabai-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://fabai-web.onrender.com

  - type: web
    name: fabai-web
    runtime: static
    rootDir: react-app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Proxy API calls to the backend (avoids CORS and build-time VITE_API_URL issues)
      - type: rewrite
        source: /api/*
        destination: https://fabai-api-n4ki.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false