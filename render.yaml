databases:
  - name: fabai-db
    plan: free
    databaseName: fabai
    user: fabai

services:
  - type: web
    name: fabai-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: starter
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fabai-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: fabai-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: fabai-web
    runtime: static
    rootDir: react-app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: fabai-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
